<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sone Restaurant - Order Food</title>
    <link rel="manifest" href="manifest (1).json">
    <link rel="icon" type="image/png" href="sonelogo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #F8F9FA; --card: #FFFFFF; --text: #1C1C1E; --orange-grad: linear-gradient(135deg, #e52d27 0%, #b31217 100%); --green: #34C759; --shadow: 0 8px 20px rgba(0,0,0,0.06); }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent;}
        .top-header { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 15px rgba(0,0,0,0.05);}
        .top-header img { height: 45px; object-fit: contain; }
        #notification-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #34C759; color: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(52, 199, 89, 0.4); z-index: 9999; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; transition: top 0.5s ease;}
        #notification-toast.show { top: 20px; }
        .sidebar { width: 260px; background-color: #FFFFFF; position: fixed; height: 100%; left: -260px; top: 0; z-index: 1001; transition: 0.3s; box-shadow: 2px 0 15px rgba(0,0,0,0.1);}
        .sidebar.show { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; backdrop-filter: blur(3px);}
        .overlay.show { display: block; }
        .nav-links { list-style: none; padding: 15px 10px; margin: 0; }
        .nav-links a { display: flex; align-items: center; padding: 14px 15px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 15px; border-radius: 12px; cursor: pointer; margin-bottom: 5px;}
        .nav-links a.active { background: var(--orange-grad); color: #fff; }
        .tab-panel { display: none; padding: 15px; padding-bottom: 90px; }
        .tab-panel.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dash-section { margin-bottom: 25px; }
        .dash-section h2 { font-family: 'Montserrat', sans-serif; font-size: 18px; color: #b31217; margin: 0 0 12px 0; border-left: 4px solid #b31217; padding-left: 10px;}
        .hero-img-container { width: 100%; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 15px;}
        .hero-img-container img { width: 100%; height: 220px; object-fit: cover; display: block;}
        .fab-order { position: fixed; bottom: 25px; right: 20px; background: var(--orange-grad); color: white; border: none; border-radius: 50px; padding: 15px 25px; font-size: 16px; font-weight: 700; box-shadow: 0 10px 25px rgba(229, 45, 39, 0.4); cursor: pointer; display: flex; align-items: center; gap: 10px; z-index: 900; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; position: relative;}
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #888; }
        input[type="text"], input[type="number"], input[type="tel"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; background: #f9f9f9; font-size: 15px; font-family: inherit; font-weight:500; box-sizing: border-box;}
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;}
        .btn-add { background: #1C1C1E; color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer;}
        .autocomplete-items { position: absolute; border: 1px solid #eee; z-index: 99; top: 100%; left: 0; right: 0; max-height: 220px; overflow-y: auto; background-color: var(--card); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .autocomplete-items div { padding: 14px 15px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 14px; display:flex; justify-content:space-between; font-weight:500;}
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px dashed #eee; }
        .btn-checkout { background: var(--green); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%;}
        .btn-danger { background: #ffebee; color: #b31217; border: 1px solid #ffcdd2; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; width: 100%; margin-top:5px;}
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--card); margin: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px;}
        .qr-box { text-align: center; padding: 15px; background: #fff; border-radius: 16px; margin-bottom: 15px; border: 2px dashed #b31217; }
        .qr-box img { width: 200px; height: 200px; object-fit: contain; margin-bottom: 10px; border-radius: 8px;}
        .history-card { border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.03);}
        .btn-photo { background: #e6f2ff; color: #007AFF; border: 1px solid #007AFF; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; width: 100%; }
        #print-receipt { position: absolute; left: -9999px; top: -9999px; width: 350px; background: white; padding: 20px; border: 2px dashed #b31217; font-family: 'Poppins', sans-serif; color: black; }
    </style>
</head>
<body>
    <div id="notification-toast"><i class="fas fa-check-circle"></i> <span id="toast-message">Order Updated!</span></div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div style="padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee;">
            <img src="sonelogo1.png" alt="Logo" style="width: 120px; object-fit: contain; margin-bottom: 10px;">
        </div>
        <ul class="nav-links">
            <li><a class="active" onclick="openTab('dashboardTab', this)"><i class="fas fa-home" style="margin-right:15px; width:20px;"></i> Home</a></li>
            <li><a onclick="openTab('billingTab', this)"><i class="fas fa-utensils" style="margin-right:15px; width:20px;"></i> Order Food</a></li>
            <li><a onclick="openTab('historyTab', this)"><i class="fas fa-receipt" style="margin-right:15px; width:20px;"></i> My Orders</a></li>
            <li id="installAppContainer" style="display:none; margin-top:15px;"><a onclick="installCustomerApp()" style="background:var(--green); color:white;"><i class="fas fa-download" style="margin-right:15px;"></i> Install App</a></li>
        </ul>
    </div>

    <div class="top-header">
        <button onclick="toggleSidebar()" style="background:transparent; border:none; font-size:24px; color:#1C1C1E; cursor:pointer;"><i class="fas fa-bars"></i></button>
        <img src="sonelogo1.png" alt="Sone Restaurant">
        <div style="width: 24px;"></div>
    </div>

    <button class="fab-order" id="quickOrderBtn" onclick="openTab('billingTab', document.querySelectorAll('.nav-links a')[1])"><i class="fas fa-shopping-cart"></i> Quick Order</button>

    <div id="dashboardTab" class="tab-panel active">
        <div class="dash-section">
            <h2>Welcome to Sone</h2>
            <div class="hero-img-container"><img src="sonfront.png" alt="Restaurant"></div>
            <p style="font-size:14px; color:#555;">Dumraon Station Road, Bihar</p>
        </div>
    </div>

    <div id="billingTab" class="tab-panel">
        <div class="card">
            <h3 style="margin: 0 0 15px 0; font-size: 18px; font-weight: 700; color:#b31217;"><i class="fas fa-search"></i> Find Your Dish</h3>
            <div class="form-group">
                <label>Search Item (नाम लिखें)</label>
                <input type="text" id="itemInput" placeholder="Ex: Paneer, Mutton, Thanda..." autocomplete="off">
                <div id="autocompleteList" class="autocomplete-items"></div>
            </div>
            <div class="input-grid">
                <div class="form-group" style="margin:0;"><label>Price (₹)</label><input type="number" id="priceInput" readonly style="background: #e9ecef;"></div>
                <div class="form-group" style="margin:0;"><label>Qty</label><input type="text" id="qtyInput" value="1"></div>
            </div>
            <button class="btn-add" onclick="addItemToBill()"><i class="fas fa-plus"></i> Add to Cart</button>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 15px 0; font-size: 18px; font-weight: 700; border-bottom: 2px solid #eee; padding-bottom:10px;"><i class="fas fa-shopping-basket" style="color:#FF9500;"></i> Your Cart</h3>
            <div style="overflow-y:auto; max-height:250px; margin-bottom:15px;">
                <table id="billTable">
                    <thead><tr><th>Item</th><th>Qty</th><th>Total</th><th style="text-align:center;">Del</th></tr></thead>
                    <tbody id="billBody"><tr><td colspan='4' style='text-align:center; color:#888;'>Cart is empty</td></tr></tbody>
                </table>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:800; margin-bottom: 20px;">
                <span>Total:</span><span style="color:var(--green);">₹ <span id="grandTotal">0</span></span>
            </div>
            <!-- LOCATION CHECK INITIATED HERE -->
            <button class="btn-checkout" onclick="verifyLocationAndCheckout()">Proceed to Pay <i class="fas fa-location-arrow"></i></button>
        </div>
    </div>

    <div id="historyTab" class="tab-panel">
        <div class="card">
            <h3 style="margin: 0 0 10px 0; font-size: 18px; font-weight: 700; color:#b31217;"><i class="fas fa-history"></i> My Order History</h3>
            <div class="form-group" style="display:flex; gap:10px;">
                <input type="tel" id="searchPhone" placeholder="Enter phone to view orders" value="" maxlength="10">
                <button class="btn-add" style="margin:0; width:auto; padding:14px 20px;" onclick="loadCustomerHistory()"><i class="fas fa-search"></i></button>
            </div>
            <div id="customerHistoryContainer" style="margin-top: 15px;"></div>
        </div>
    </div>

    <div id="print-receipt"></div>

    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div style="text-align: right;"><i class="fas fa-times" style="font-size:24px; color:#888; cursor:pointer;" onclick="closeModal()"></i></div>
            <h3 style="margin: -15px 0 15px 0; text-align: center;">Payment Details</h3>
            <div class="qr-box">
                <img src="qr.png" alt="Scan QR Code to Pay">
                <div style="color:var(--green); font-size:28px; font-weight:800; margin-top:5px;">₹ <span id="modalGrandTotal">0</span></div>
            </div>
            <div class="form-group"><label>Your Name (नाम)</label><input type="text" id="custName"></div>
            <div class="form-group"><label>Phone No. (मोबाइल)</label><input type="tel" id="custPhone" maxlength="10"></div>
            <button class="btn-checkout" onclick="placeOrderAndWhatsApp()" style="background: #25D366; margin-top:10px;"><i class="fab fa-whatsapp"></i> Send on WhatsApp</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gvsimqxwfuugugssvcus.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2c2ltcXh3ZnV1Z3Vnc3N2Y3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTcwOTUsImV4cCI6MjEwNjMzMzA5NX0.b1aIHuURJ4jqy7T9ulzzD9e5O7fjTcuer0_QhPlZTKk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const RESTAURANT_WHATSAPP_NUMBER = '919155745145'; 

        // Dumraon Station Road Approx Coordinates
        const RESTAURANT_LAT = 25.5560; 
        const RESTAURANT_LON = 84.1510;

        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('installAppContainer').style.display = 'block';
        });
        function installCustomerApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') document.getElementById('installAppContainer').style.display = 'none';
                    deferredPrompt = null;
                });
            }
        }
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw (1).js'); }); }

        let menuData = {}; let itemNames = []; let billItems = []; 
        async function fetchMenu() {
            const { data } = await supabaseClient.from('app_menu').select('*');
            if (data) { data.forEach(item => { menuData[item.item_name] = item.price; }); itemNames = Object.keys(menuData); }
        }
        fetchMenu(); 

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); document.getElementById('overlay').classList.toggle('show'); }
        function openTab(tabId, el) { 
            document.querySelectorAll('.tab-panel').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
            document.getElementById(tabId).classList.add('active'); if(el) el.classList.add('active'); 
            document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show');
            document.getElementById('quickOrderBtn').style.display = (tabId === 'billingTab' || tabId === 'historyTab') ? 'none' : 'flex';
            if(tabId === 'historyTab') { 
                let savedPhone = localStorage.getItem('sone_cust_phone'); 
                if(savedPhone) { document.getElementById('searchPhone').value = savedPhone; loadCustomerHistory(); }
            }
        }

        const input = document.getElementById("itemInput"), list = document.getElementById("autocompleteList");
        input.addEventListener("input", function() {
            list.innerHTML = ""; document.getElementById("priceInput").value = "";
            if (!this.value) return;
            itemNames.forEach(i => {
                if (i.toLowerCase().includes(this.value.toLowerCase())) {
                    let b = document.createElement("DIV"); b.innerHTML = `<span>${i}</span><span style="color:#b31217; font-weight:bold;">₹ ${menuData[i]}</span><input type='hidden' value='${i.replace(/'/g, "&#39;")}'>`;
                    b.addEventListener("click", function() { input.value = this.getElementsByTagName("input")[0].value; document.getElementById("priceInput").value = menuData[input.value]; list.innerHTML = ""; document.getElementById("qtyInput").focus(); });
                    list.appendChild(b);
                }
            });
        });
        document.addEventListener("click", e => { if(e.target !== input) list.innerHTML = ""; });

        function addItemToBill() {
            let n = document.getElementById("itemInput").value, p = parseFloat(document.getElementById("priceInput").value), qInput = document.getElementById("qtyInput").value.trim().toUpperCase();
            if(!n || isNaN(p)) return alert("Please select a dish!");
            let q = parseInt(qInput) || 1; let finalPrice = p, finalName = n;
            if (qInput === 'H') { finalPrice = Math.round(p / 2); finalName = n + " (Half)"; q=1; } else if (qInput === 'FH') { finalPrice = p + Math.round(p / 2); finalName = n + " (F+H)"; q=1; }
            let totalAmount = finalPrice * q, idx = billItems.findIndex(i => i.name === finalName && i.price === finalPrice);
            if(idx > -1) { billItems[idx].qty += q; billItems[idx].total = billItems[idx].qty * billItems[idx].price; } else { billItems.push({name: finalName, price: finalPrice, qty: q, total: totalAmount}); }
            updateBillDisplay(); document.getElementById("itemInput").value=""; document.getElementById("priceInput").value=""; document.getElementById("qtyInput").value="1";
        }

        function updateBillDisplay() {
            let tb = document.getElementById("billBody"); tb.innerHTML = ""; let gt = 0;
            if(billItems.length === 0) tb.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Cart is empty</td></tr>";
            else { billItems.forEach((i, idx) => { gt += i.total; tb.innerHTML += `<tr><td>${i.name}</td><td>${i.qty}</td><td style="font-weight:bold;">₹${i.total}</td><td style="text-align:center;"><button onclick="billItems.splice(${idx},1);updateBillDisplay();" style="background:#ffebee;color:#b31217;border:1px solid #ffcdd2;padding:6px;border-radius:8px;cursor:pointer;"><i class="fas fa-trash-alt"></i></button></td></tr>`; }); }
            document.getElementById("grandTotal").innerText = gt;
        }

        // --- 5 KM Location Check Logic ---
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = (lat2-lat1) * (Math.PI/180); var dLon = (lon2-lon1) * (Math.PI/180);
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; // Distance in km
        }

        function verifyLocationAndCheckout() {
            if(billItems.length === 0) return alert("Cart khali hai!");
            if (navigator.geolocation) {
                alert("Location checking... Please wait.");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let dist = getDistanceFromLatLonInKm(position.coords.latitude, position.coords.longitude, RESTAURANT_LAT, RESTAURANT_LON);
                        if(dist > 5) { alert(`Sorry! Aap Sone Restaurant se ${dist.toFixed(1)} km door hain. Delivery sirf 5km ke andar hoti है.`); } 
                        else { openCheckoutModal(); }
                    },
                    (error) => { alert("Order karne ke liye Location (GPS) on karna zaroori hai!"); }
                );
            } else { alert("Aapka browser location support nahi karta."); }
        }

        function openCheckoutModal() {
            document.getElementById('modalGrandTotal').innerText = billItems.reduce((s,i) => s + i.total, 0);
            document.getElementById('custName').value = localStorage.getItem('sone_cust_name') || '';
            document.getElementById('custPhone').value = localStorage.getItem('sone_cust_phone') || '';
            document.getElementById('checkoutModal').style.display = 'block';
        }
        function closeModal() { document.getElementById('checkoutModal').style.display = 'none'; }

        async function placeOrderAndWhatsApp() {
            let name = document.getElementById('custName').value.trim(), phone = document.getElementById('custPhone').value.trim(), gt = parseFloat(document.getElementById('modalGrandTotal').innerText);
            if(!name || !phone || phone.length < 10) return alert("Sahi Naam aur Phone Number dalein!");
            localStorage.setItem('sone_cust_name', name); localStorage.setItem('sone_cust_phone', phone);
            
            let orderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
            
            // Save to Supabase DB Directly
            try { await supabaseClient.from('customer_orders').insert([{ order_id: orderId, customer_name: name, phone: phone, total_amount: gt, items_json: billItems, order_status: 'Checking' }]); } catch(e) {}

            let waText = `*NEW ONLINE ORDER* 🚨%0A%0A*Order ID:* ${orderId}%0A*Name:* ${name}%0A*Phone:* ${phone}%0A%0A*ITEMS:*%0A`;
            billItems.forEach(i => { waText += `▪️ ${i.name} (Qty: ${i.qty}) - ₹${i.total}%0A`; });
            waText += `%0A*TOTAL PAYABLE:* ₹${gt}%0A*Payment Mode:* Online QR Scanned%0A%0A_Please verify my payment and accept order!_`;
            window.open(`https://wa.me/${RESTAURANT_WHATSAPP_NUMBER}?text=${waText}`, '_blank');
            billItems = []; updateBillDisplay(); closeModal(); document.getElementById('searchPhone').value = phone; openTab('historyTab', document.querySelectorAll('.nav-links a')[2]);
        }

        // --- Privacy & Fetching Order History via Supabase ---
        async function loadCustomerHistory() {
            let phone = document.getElementById("searchPhone").value.trim();
            if(!phone) return alert("Apna mobile number dalein!");
            let container = document.getElementById("customerHistoryContainer"); container.innerHTML = "Fetching your orders...";
            
            const { data, error } = await supabaseClient.from('customer_orders').select('*').eq('phone', phone).order('id', { ascending: false });
            if (error || !data || data.length === 0) { container.innerHTML = `<div style="text-align:center; padding: 20px; color:#888;">No past orders found for this number.</div>`; return; }
            
            container.innerHTML = "";
            data.forEach(order => {
                let isAccepted = order.order_status.includes('Accepted');
                let html = `<div class="history-card" style="${isAccepted ? 'border-left: 4px solid var(--green);' : ''}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:5px;"><span style="font-weight:bold; color:#333;">${order.order_id}</span><span style="color:var(--green); font-weight:800;">₹${order.total_amount}</span></div>
                    <div style="font-size:13px; color:#555; line-height:1.6;">`;
                if(order.items_json) { order.items_json.forEach(i => { html += `<div>• ${i.name} (x${i.qty})</div>`; }); }
                html += `</div><div style="margin-top:10px; font-size:12px; font-weight:600; color:${isAccepted ? 'var(--green)' : '#FF9500'};">Status: ${order.order_status}</div>`;
                
                // Cancel Order feature for customer
                if(!isAccepted) { html += `<button class="btn-danger" onclick="cancelMyOrder('${order.order_id}')"><i class="fas fa-times-circle"></i> Cancel Order</button>`; }
                
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        async function cancelMyOrder(orderId) {
            if(confirm("Are you sure you want to cancel this order?")) {
                await supabaseClient.from('customer_orders').delete().eq('order_id', orderId);
                alert("Order Cancelled!"); loadCustomerHistory();
            }
        }
    </script>
</body>
</html>
